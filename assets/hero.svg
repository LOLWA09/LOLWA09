<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc"><title id="title">VerseTube developer profile</title><desc id="desc">A compact GitHub dark-theme profile banner with the VerseTube name and three engineering principles.</desc><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#21262d" stroke-width="1"/></pattern></defs><rect width="1200" height="220" rx="18" fill="#0d1117"/><rect x="1" y="1" width="1198" height="218" rx="17" fill="none" stroke="#30363d" stroke-width="2"/><rect width="1200" height="220" rx="18" fill="url(#grid)"/><circle cx="1100" cy="28" r="92" fill="#58a6ff" opacity=".06"/><circle cx="1100" cy="28" r="54" fill="none" stroke="#58a6ff" opacity=".22"/><circle cx="1144" cy="61" r="5" fill="#3fb950"/><g transform="translate(72 70)"><text x="0" y="26" font-family="Arial" font-size="28" font-weight="700" fill="#f0f6fc">VerseTube</text><text x="1" y="50" font-family="monospace" font-size="11" fill="#8b949e">@LOLWA09</text><rect x="0" y="76" width="120" height="2" fill="#58a6ff"/></g><g transform="translate(820 60)" font-family="monospace" font-size="14"><text fill="#6e7681">01</text><text x="34" fill="#c9d1d9">make it useful</text><text y="34" fill="#6e7681">02</text><text x="34" y="34" fill="#c9d1d9">make it clear</text><text y="68" fill="#6e7681">03</text><text x="34" y="68" fill="#3fb950">make it last</text></g><rect x="72" y="180" width="1056" height="2" fill="#30363d"/><rect x="72" y="180" width="180" height="2" fill="#58a6ff"/></svg>