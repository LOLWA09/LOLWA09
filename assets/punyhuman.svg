<svg xmlns="http://www.w3.org/2000/svg" width="840" height="250" viewBox="0 0 840 250" role="img" aria-labelledby="title desc"><title id="title">PunyHuman project card</title><desc id="desc">A GitHub dark-theme project card for a private offline-capable developer toolbox.</desc><rect width="840" height="250" rx="16" fill="#0d1117"/><rect x="1" y="1" width="838" height="248" rx="15" fill="none" stroke="#30363d" stroke-width="2"/><rect x="42" y="42" width="50" height="50" rx="6" fill="#58a6ff"/><text x="67" y="76" text-anchor="middle" font-family="Arial" font-size="24" font-weight="900" fill="#0d1117">P</text><text x="112" y="65" font-family="Arial" font-size="25" font-weight="800" fill="#f0f6fc">PunyHuman</text><circle cx="116" cy="84" r="4" fill="#3fb950"/><text x="128" y="88" font-family="monospace" font-size="12" fill="#8b949e">OPEN SOURCE · ZERO BACKEND</text><text x="42" y="140" font-family="Arial" font-size="25" font-weight="700" fill="#f0f6fc">Private developer tools that stay in your browser.</text><text x="42" y="176" font-family="Arial" font-size="15" fill="#8b949e">JSON · JWT · Base64 · URL · UUID · SHA-256 · PWA</text><rect x="42" y="204" width="122" height="2" fill="#58a6ff"/><text x="694" y="211" font-family="Arial" font-size="14" font-weight="700" fill="#58a6ff">VIEW PROJECT  ↗</text></svg>